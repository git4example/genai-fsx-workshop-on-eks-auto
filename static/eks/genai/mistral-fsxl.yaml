
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mistral-inf2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mistral-inf2-server
  template:
    metadata:
      labels:
        app: vllm-mistral-inf2-server
    spec:
      schedulerName: my-scheduler
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - FSX_LUSTRE_AZ # Replace with your FSx Lustre AZ
      tolerations:
        - key: "aws.amazon.com/neuron"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-server
          image: public.ecr.aws/u3r1l1j7/eks-genai:neuronrayvllm-100G-root
          resources:
            requests:
              aws.amazon.com/neuron: 1
            limits:
              aws.amazon.com/neuron: 1
          args:
            - --model=$(MODEL_ID)
            - --enforce-eager
            - --gpu-memory-utilization=0.96
            - --device=neuron
            - --max-num-seqs=4
            - --tensor-parallel-size=2
            - --max-model-len=10240
            - --served-model-name=mistralai/Mistral-7B-Instruct-v0.2-neuron
          env:
            - name: MODEL_ID
              value: /work-dir/Mistral-7B-Instruct-v0.2/
            - name: NEURON_COMPILE_CACHE_URL
              value: /work-dir/Mistral-7B-Instruct-v0.2/neuron-cache/
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: persistent-storage
              mountPath: "/work-dir"

          # livenessProbe: Ensures the container is still running properly. Restarts after 15 mins if it continues to fails after initial delay of 3 min
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180     # No delay since startup probe handles initial startup
            periodSeconds: 30          # Check every 30 seconds once running
            timeoutSeconds: 10         # 10 second timeout
            failureThreshold: 24       # Restart after 24 consecutive failures (24 * 30s = 720s + 3 mins startup = 15 minutes)
            successThreshold: 1        # Only need 1 success to be considered healthy
         
          # readinessProbe: Checks if the application is ready to accept traffic after initial delay of 3 min
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180     # No delay since startup probe handles initial startup
            periodSeconds: 10          # Check every 10 seconds for faster traffic routing
            timeoutSeconds: 5          # Shorter timeout for readiness
            failureThreshold: 3        # Remove from service after 3 failures (30 seconds)
            successThreshold: 1        # Only need 1 success to receive traffic
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: fsx-lustre-claim
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mistral7b-service
  labels:
    app: vllm-mistral-inf2-server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: vllm-mistral-inf2-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
