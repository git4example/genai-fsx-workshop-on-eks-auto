# Comprehensive vLLM + Neuron Monitoring Dashboard
# This dashboard includes all requested metrics:
# - Neuron CPU usage
# - GPU memory usage  
# - All vLLM metrics (prompt_tokens_total, generation_tokens_total, etc.)

apiVersion: v1
kind: ConfigMap
