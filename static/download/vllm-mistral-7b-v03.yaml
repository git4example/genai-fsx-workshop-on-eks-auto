apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mistral-7b-v03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mistral-7b-v03
  template:
    metadata:
      labels:
        app: vllm-mistral-7b-v03
    spec:
      securityContext:
        runAsUser: 0 # Run as root
        runAsGroup: 0 # Run as root group
        fsGroup: 0 # Ensure volume access
      schedulerName: my-scheduler
      tolerations:
        - key: "aws.amazon.com/neuron"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-server
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.9.1-neuronx-py310-sdk2.25.0-ubuntu22.04
          resources:
            requests:
              aws.amazon.com/neuron: 1
              # memory: "32Gi" # Use more memory for faster compilation
              # cpu: "8" # Use more CPU for faster compilation
            limits:
              aws.amazon.com/neuron: 1
              # memory: "125Gi" # Generous memory limit for inf2.8xlarge
              # cpu: "12" # More CPU for compilation
          args:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            - --model=$(MODEL_ID)
            - --max-num-seqs=4
            - --max-model-len=10240
            - --tensor-parallel-size=1
            - --port=8000
            - --device=neuron
            - --override-neuron-config={"enable_bucketing":false}
            - --host=0.0.0.0
            - --served-model-name=mistralai/Mistral-7B-Instruct-v0.3
          env:
            - name: VLLM_NEURON_FRAMEWORK
              value: "neuronx-distributed-inference"
            - name: MODEL_ID
              value: /work-dir/Mistral-7B-Instruct-v0.3/
            - name: NEURON_COMPILE_CACHE_URL
              value: /work-dir/Mistral-7B-Instruct-v0.3/neuron-cache/
            - name: PORT
              value: "8000"
            - name: NEURON_COMPILED_ARTIFACTS
              value: /work-dir/Mistral-7B-Instruct-v0.3/neuron-cache/
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: persistent-storage
              mountPath: "/work-dir"
            - name: shm-volume
              mountPath: /dev/shm

          # livenessProbe: Ensures the container is still running properly. Restarts after 15 mins if it continues to fails after initial delay 
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180     # No delay since startup probe handles initial startup
            periodSeconds: 30          # Check every 30 seconds once running
            timeoutSeconds: 10         # 10 second timeout
            failureThreshold: 30       # Restart after 24 consecutive failures (30 * 30s = 900s + 3 mins startup = 18 minutes)
            successThreshold: 1        # Only need 1 success to be considered healthy
         
          # readinessProbe: Checks if the application is ready to accept traffic after startup probe succeeds after 3 mins.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180     # No delay since startup probe handles initial initial delay
            periodSeconds: 10          # Check every 10 seconds for faster traffic routing
            timeoutSeconds: 5          # Shorter timeout for readiness
            failureThreshold: 3        # Remove from service after 3 failures (30 seconds)
            successThreshold: 1        # Only need 1 success to receive traffic
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: fsx-lustre-claim
        - name: shm-volume
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi # Larger shared memory for compilation

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mistral-7b-v03-service
  labels:
    app: vllm-mistral-7b-v03
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: vllm-mistral-7b-v03
